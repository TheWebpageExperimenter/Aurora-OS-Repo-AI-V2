# Aurora OS Alpha 1.0.11 — Limine boot menu branding
# Keep a visible menu for recovery / alternate boot choices.
/Aurora OS Alpha 1.0.11
    protocol: limine
    path: boot():/BOOT/KERNEL.ELF
    resolution: 1920x1080x32
    comment: Aurora OS Alpha 1.0.11 x86-64 | TLS API v2 | CA bundle packaged | browser capability API v2
    timeout: 5

# Branding applies to Limine's menu UI; this does not replace the bootloader binary.
interface_branding: Aurora OS Alpha 1.0.11
interface_resolution: 1920x1080
